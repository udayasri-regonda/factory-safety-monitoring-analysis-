<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Safety Investigation Workbench</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#5d6b7c;--line:#dde2e8;--acc:#1f5fbf;--crit:#b42318;--high:#d9480f;--med:#b7791f;--low:#3f7d4e;--ok:#1a7f4b;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mute:#98a5b5;--line:#2d3744;--acc:#6ea8fe;--crit:#ff8a7a;--high:#ffa06b;--med:#f0c36a;--low:#7bc890;--ok:#6fd49b;--warn:#3a3217}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 12px 0 0}nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none}nav a.on{background:var(--acc);color:#fff}
main{padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile .n{font-size:26px;font-weight:650}.tile .l{color:var(--mute);font-size:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600}
.scroll{overflow:auto;max-height:520px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid currentColor}
.CRITICAL{color:var(--crit)}.HIGH{color:var(--high)}.MEDIUM{color:var(--med)}.LOW{color:var(--low)}
.banner{background:var(--warn);border:1px solid var(--med);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.bad{border-color:var(--crit);color:var(--crit)}.good{border-color:var(--ok);color:var(--ok)}
label{display:inline-flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px;margin:0 8px 8px 0}
input,select,textarea,button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}button.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
a{color:var(--acc)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}.mute{color:var(--mute)}
.bar{height:10px;background:var(--acc);border-radius:3px;min-width:1px}.row{display:flex;gap:8px;align-items:center}
.err{background:#fde8e6;color:#7a1710;border:1px solid var(--crit);padding:8px;border-radius:6px;margin-bottom:10px}
.ok{background:#e4f6ec;color:#0f5132;border:1px solid var(--ok);padding:8px;border-radius:6px;margin-bottom:10px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.role-TRIGGER{font-weight:600}.role-CONTEXT_BEFORE,.role-CONTEXT_AFTER{color:var(--mute)}
@media (max-width:600px){main{padding:8px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Factory Safety Investigation Workbench</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label style="margin:0">Your name (recorded in the audit log)<input id="who" placeholder="e.g. A. Reddy" autocomplete="off"></label>
</header>
<main>
  <div class="banner" role="note"><b>Advisory only.</b> Findings are generated by documented rules and must be validated by qualified personnel. This system never operates or changes industrial equipment.</div>
  <div id="msg"></div>
  <div id="view" aria-live="polite">Loading...</div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sev=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;
const fmt=n=>n==null?'—':Number(n).toLocaleString('en-US');
const ts=t=>t?esc(String(t).replace('T',' ').replace('Z',' UTC')):'—';
let state={};
try{$('#who').value=localStorage.getItem('who')||''}catch(e){}
$('#who').addEventListener('input',e=>{try{localStorage.setItem('who',e.target.value)}catch(_){}});
const who=()=>$('#who').value.trim();
function note(kind,text){$('#msg').innerHTML=text?`<div class="${kind}" role="status">${esc(text)}</div>`:''}
async function api(path,opt){
  const r=await fetch(path,opt); let j=null; try{j=await r.json()}catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||`Request failed (${r.status})`); return j;
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const qs=o=>Object.entries(o).filter(([k,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
let PLANTS=[];
const TABS=[['overview','Overview'],['findings','Findings'],['machines','Machine risk'],['actions','Corrective actions'],['quality','Data quality'],['evaluation','Evaluation'],['rules','Rules']];
function nav(cur){$('#nav').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${cur===k?'on':''}">${l}</a>`).join('')}
const empty=t=>`<p class="mute">${esc(t)}</p>`;

function tbl(cols,rows,empt){
  if(!rows.length) return empty(empt||'No records match.');
  return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const fl=id=>`<a class="mono" href="#finding/${esc(id)}">${esc(id)}</a>`;
const ml=id=>`<a href="#machine/${esc(id)}">${esc(id)}</a>`;

/* ---------- Overview ---------- */
async function overview(){
  const plant=state.plant||'';
  const o=await api('/api/overview'+(plant?'?plant='+plant:''));
  const t=o.totals, s=o.findings_by_severity, ca=o.corrective_actions, dq=o.data_quality, ev=o.evaluation;
  const maxv=Math.max(1,...o.alarm_volume_by_day.map(d=>d.n));
  const tile=(n,l)=>`<div class="card tile"><div class="n">${fmt(n)}</div><div class="l">${l}</div></div>`;
  return `
  <div class="row" style="margin-bottom:10px"><label>Plant<select id="plantSel"><option value="">All plants</option>${PLANTS.map(p=>`<option ${p===plant?'selected':''}>${p}</option>`).join('')}</select></label>
    <button id="rerun">Re-run analysis</button><span class="mute">Run #${o.run?o.run.run_id:'—'} · ${o.run?esc(o.run.source.split(/[\\/]/).pop()):''} · digest <span class="mono">${o.run?esc(o.run.digest.slice(0,12)):''}</span> · data up to ${ts(o.run&&o.run.summary.as_of)}</span></div>
  <div class="grid">${tile(t.plants,'Plants')}${tile(t.machines,'Machines')}${tile(t.alarm_events,'Alarm events analysed')}${tile(t.incidents,'Incidents')}${tile(t.findings,'Active findings')}</div>
  <div class="two">
   <div class="card"><h2>Findings by severity</h2>${['CRITICAL','HIGH','MEDIUM','LOW'].map(k=>`<div class="row"><span style="width:80px">${sev(k)}</span><div class="bar ${k}" style="background:currentColor;width:${t.findings?Math.round(220*s[k]/t.findings):0}px"></div><span>${fmt(s[k])}</span></div>`).join('')}
     <h3>By review status</h3>${Object.entries(o.findings_by_review).map(([k,v])=>`<div>${esc(k)}: <b>${fmt(v)}</b></div>`).join('')}
     <h3>By resolution status</h3>${['NO_ACTION','ACTION_IN_PROGRESS','CLOSED_UNVERIFIED','VERIFIED_RESOLVED'].map(k=>`<div>${esc(k)}: <b>${fmt(o.findings_by_resolution[k]||0)}</b></div>`).join('')}
     <p class="mute">"Resolved" is only ever shown for findings whose actions were independently verified.</p></div>
   <div class="card"><h2>Highest-risk machines</h2>${tbl([['Rank',r=>r.rank],['Machine',r=>ml(r.machine_id)],['Plant',r=>esc(r.plant_id)],['Risk index',r=>fmt(r.risk_score)]],o.high_risk_machines)}
     <p class="mute">Risk index is a relative ranking (weighted counts), not an accident probability.</p></div>
  </div>
  <div class="two">
   <div class="card"><h2>Corrective actions</h2>
     <div>Workbench actions open: <b>${ca.workbench_open}</b> (overdue: <b>${ca.workbench_overdue}</b>)</div>
     <div>Workbench actions closed <u>without</u> verification: <b>${ca.workbench_closed_unverified}</b></div>
     <div>Source-data actions closed without required verification: <b>${ca.source_closed_without_verification}</b></div>
     <div>Source-data actions not yet closed: <b>${ca.source_not_closed}</b></div>
     <p><a href="#actions">Open corrective-action tracker</a></p></div>
   <div class="card"><h2>Data quality &amp; detection evaluation</h2>
     ${dq?`<div>Source rows read: <b>${fmt(dq.rows_read)}</b> · valid: <b>${fmt(dq.rows_valid)}</b> · rejected: <b>${fmt(dq.rows_rejected)}</b></div>
     <div>Acknowledgements without an ingested event: <b>${fmt(dq.acknowledgements_without_ingested_event)}</b></div>`:''}
     <p><a href="#quality">Inspect rejected records</a></p>
     ${ev?`<div>Synthetic ground truth: precision <b>${(100*ev.precision).toFixed(1)}%</b>, recall <b>${(100*ev.recall).toFixed(1)}%</b>, F1 <b>${(100*ev.f1).toFixed(1)}%</b> (TP ${ev.true_positives}, FP ${ev.false_positives}, FN ${ev.false_negatives}) — <a href="#evaluation">details</a></div>`:empty('No ground truth available for this data source.')}</div>
  </div>
  <div class="card"><h2>Alarm volume per day (UTC)</h2>${o.alarm_volume_by_day.length?`<div class="scroll"><table>${o.alarm_volume_by_day.map(d=>`<tr><td class="mono" style="width:90px">${esc(d.day)}</td><td><div class="bar" style="width:${Math.round(400*d.n/maxv)}px"></div></td><td style="width:60px">${fmt(d.n)}</td></tr>`).join('')}</table></div>`:empty('No alarm events.')}</div>`;
}
function bindOverview(){
  const p=$('#plantSel'); if(p) p.onchange=e=>{state.plant=e.target.value;render()};
  const b=$('#rerun'); if(b) b.onclick=async()=>{b.disabled=true;note('ok','Re-running analysis...');try{const r=await post('/api/rerun',{});
    note(r.identical_to_previous?'ok':'err',`Run #${r.run_id}: ${r.findings} findings from ${r.events} events. Digest ${r.digest.slice(0,12)} is ${r.identical_to_previous?'IDENTICAL to':'DIFFERENT from'} the previous run (${(r.previous_digest||'none').slice(0,12)}).`);render(true)}catch(e){note('err',e.message)}b.disabled=false}
}

/* ---------- Findings list ---------- */
async function findings(){
  const f=state.ff||{}; const rules=await api('/api/rules');
  const d=await api('/api/findings?'+qs({...f,limit:300}));
  const sel=(id,opts,v,all)=>`<label>${id}<select data-f="${id}"><option value="">${all}</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  return `<div class="card"><h2>Findings</h2><form id="ff">
    ${sel('plant',PLANTS,f.plant,'All')}${sel('severity',['CRITICAL','HIGH','MEDIUM','LOW'],f.severity,'All')}
    <label>rule<select data-f="rule"><option value="">All</option>${rules.map(r=>`<option value="${r.rule_id}" ${r.rule_id===f.rule?'selected':''}>${esc(r.rule_id)} ${esc(r.name)}</option>`).join('')}</select></label>
    ${sel('review',['NEW','UNDER_REVIEW','CONFIRMED','DISMISSED'],f.review,'All')}
    <label>machine<input data-f="machine" value="${esc(f.machine||'')}" size="6" placeholder="M001"></label>
    <label>from<input type="date" data-f="date_from" value="${esc(f.date_from||'')}"></label><label>to<input type="date" data-f="date_to" value="${esc(f.date_to||'')}"></label>
    <label>search<input data-f="q" value="${esc(f.q||'')}" placeholder="id or title"></label>
    <button type="submit">Apply</button> <button type="button" class="sec" id="clr">Clear</button></form>
    <p class="mute">${fmt(d.total)} findings match${d.total>d.items.length?` (showing first ${d.items.length}; narrow the filters)`:''}. Date filter keeps findings whose observation window overlaps the range.</p>
    ${tbl([['ID',r=>fl(r.finding_id)],['Severity',r=>sev(r.severity)],['Rule',r=>esc(r.rule_name)],['Machine',r=>ml(r.machine_id)],['Window start',r=>ts(r.window_start)],['Title',r=>esc(r.title)],['Review',r=>esc(r.review_status)],['Resolution',r=>esc(r.resolution)]],d.items,'No findings match these filters.')}</div>`;
}
function bindFindings(){
  $('#ff').onsubmit=e=>{e.preventDefault();state.ff={};document.querySelectorAll('[data-f]').forEach(x=>{if(x.value)state.ff[x.dataset.f]=x.value.trim()});render()};
  $('#clr').onclick=()=>{state.ff={};render()};
}

/* ---------- Investigation ---------- */
async function finding(id){
  const d=await api('/api/findings/'+id); state.cur=d;
  const rcls=d.resolution.code==='VERIFIED_RESOLVED'?'good':(d.resolution.code==='CLOSED_UNVERIFIED'?'bad':'');
  const mr=d.machine_risk; const maxp=mr?Math.max(1,...mr.components.map(c=>c.points)):1;
  const nextOf={OPEN:'IN_PROGRESS',IN_PROGRESS:'COMPLETED',COMPLETED:'CLOSED'};
  return `<p><a href="#findings">← All findings</a></p>
  <div class="card"><h2><span class="mono">${esc(d.finding_id)}</span> ${sev(d.severity)} ${esc(d.title)}</h2>
   <div class="grid" style="margin:8px 0"><div><span class="mute">Plant / machine</span><br>${esc(d.plant_id)} / ${ml(d.machine_id)}</div><div><span class="mute">Observation window</span><br>${ts(d.window_start)}<br>→ ${ts(d.window_end)}</div>
   <div><span class="mute">Review</span><br><b>${esc(d.review.review_status)}</b>${d.review.reviewer?` by ${esc(d.review.reviewer)}`:''}</div><div><span class="mute">Resolution</span><br><span class="badge ${rcls}">${esc(d.resolution.label)}</span></div></div>
   ${d.active?'':'<div class="err">This finding was not reproduced by the latest analysis run (data changed). Kept for the audit trail.</div>'}
   <p><a href="/api/findings/${esc(d.finding_id)}/export"><button type="button">Export investigation (zip)</button></a></p></div>
  <div class="two"><div class="card"><h2>Why this finding exists</h2>
   <h3>Rule ${esc(d.rule_id)} — ${esc(d.rule_name)}</h3><p>${esc(d.rule_logic)}</p>
   <h3>Observed facts (from records)</h3><ul>${d.observed.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <h3>Interpretation (inferred — not confirmed)</h3><p>${esc(d.inferred)}</p>
   <h3>Severity rationale</h3><p>${sev(d.severity)} ${esc(d.severity_rationale)}</p>
   <h3>Parameters used</h3><p class="mono">${esc(JSON.stringify(d.params))}</p></div>
   <div class="card"><h2>Missing &amp; contradictory evidence</h2>
   ${d.missing_evidence.length?`<ul>${d.missing_evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:empty('No missing evidence identified from the available records.')}
   <h3>Contradictions</h3>${d.contradictions.length?`<ul>${d.contradictions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:empty('None identified.')}
   <h3>Recommended investigation steps</h3><ol>${d.recommended_steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div>
  <div class="card"><h2>Chronological evidence (${d.evidence.length} records)</h2>
   ${tbl([['Time (UTC)',r=>ts(r.ts)],['Type',r=>esc(r.record_type)],['ID',r=>`<span class="mono">${esc(r.record_id)}</span>`],['Role',r=>`<span class="role-${esc(r.role)}">${esc(r.role)}</span>`],['Detail',r=>esc(r.summary)]],d.evidence,'Evidence unavailable')}
   <p class="mute">TRIGGER = records that caused the finding; CONTEXT = neighbouring alarms on the same machine; RELATED = linked incidents/actions.</p></div>
  <div class="two"><div class="card"><h2>Machine risk factors — ${ml(d.machine_id)}</h2>
   ${mr?`<p>Risk index <b>${fmt(mr.score)}</b>, rank <b>${mr.rank}</b> of ${mr.fleet_size} machines (higher than ${mr.percentile_in_fleet}% of fleet). Fleet median ${mr.fleet_median_score}; plant median ${mr.plant_median_score}.</p>
   <table><thead><tr><th>Factor</th><th>Count</th><th>Weight</th><th>Points</th><th></th></tr></thead><tbody>${mr.components.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.count}</td><td>${c.weight}</td><td>${c.points}</td><td><div class="bar" style="width:${Math.round(100*c.points/maxp)}px"></div></td></tr>`).join('')}</tbody></table>
   <p class="mute">${esc(mr.interpretation)}</p>`:empty('Risk data unavailable.')}</div>
   <div class="card"><h2>Review</h2><form id="revForm"><label>Status<select id="revStatus">${['NEW','UNDER_REVIEW','CONFIRMED','DISMISSED'].map(s=>`<option ${s===d.review.review_status?'selected':''}>${s}</option>`).join('')}</select></label>
   <label>Note<input id="revNote" size="30" value="${esc(d.review.note||'')}"></label><button>Save review</button></form>
   <p class="mute">CONFIRMED / DISMISSED are human decisions; the detector never sets them.</p></div></div>
  <div class="card"><h2>Corrective actions &amp; verification</h2>
   <div class="banner ${rcls}">${esc(d.resolution.label)}</div>
   ${d.actions.length?d.actions.map(a=>`<div class="card"><b class="mono">${esc(a.wb_action_id)}</b> ${esc(a.description)}<br><span class="mute">Owner ${esc(a.owner)} · due ${esc(a.due_date||'n/a')} · status</span> <b>${esc(a.closure_state)}</b>
     ${nextOf[a.status]?`<button class="sec" data-adv="${esc(a.wb_action_id)}" data-to="${nextOf[a.status]}">Move to ${nextOf[a.status]}</button>`:''}
     ${a.verifications.map(v=>`<div class="ok">Verified by ${esc(v.verified_by)} (${esc(v.method)}) at ${ts(v.verified_ts)}: ${esc(v.evidence_text)} ${v.evidence_ref?`[ref ${esc(v.evidence_ref)}]`:''}</div>`).join('')}
     ${(a.status==='COMPLETED'||a.status==='CLOSED')?`<form data-ver="${esc(a.wb_action_id)}"><label>Verifier<input name="by" required></label><label>Method<input name="method" required placeholder="e.g. physical inspection"></label><label>Evidence<input name="ev" required size="34" placeholder="what was checked and found"></label><label>Reference<input name="ref" placeholder="doc / photo id"></label><button>Record verification</button></form>`:''}</div>`).join(''):empty('No corrective action recorded for this finding.')}
   <h3>New corrective action</h3><form id="actForm"><label>Description<input id="aDesc" size="38" required></label><label>Owner<input id="aOwner" required></label><label>Due<input type="date" id="aDue"></label><button>Create action</button></form></div>`;
}
function bindFinding(){
  const d=state.cur, reload=async m=>{note('ok',m);render(true)};
  $('#revForm').onsubmit=async e=>{e.preventDefault();try{await post(`/api/findings/${d.finding_id}/review`,{status:$('#revStatus').value,reviewer:who(),note:$('#revNote').value});reload('Review saved.')}catch(x){note('err',x.message)}};
  $('#actForm').onsubmit=async e=>{e.preventDefault();try{const r=await post(`/api/findings/${d.finding_id}/actions`,{description:$('#aDesc').value,owner:$('#aOwner').value,due_date:$('#aDue').value,actor:who()});reload('Created '+r.wb_action_id)}catch(x){note('err',x.message)}};
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=async()=>{try{await post(`/api/actions/${b.dataset.adv}/status`,{status:b.dataset.to,actor:who()});reload(b.dataset.to==='CLOSED'?'Action closed. Without verification it is NOT counted as resolved.':'Status updated.')}catch(x){note('err',x.message)}});
  document.querySelectorAll('[data-ver]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const g=n=>f.querySelector(`[name=${n}]`).value;try{await post(`/api/actions/${f.dataset.ver}/verify`,{verified_by:g('by'),method:g('method'),evidence_text:g('ev'),evidence_ref:g('ref')});reload('Verification recorded.')}catch(x){note('err',x.message)}});
}

/* ---------- Machines ---------- */
async function machines(){
  const f=state.mf||{}; const d=await api('/api/machines?'+qs(f));
  return `<div class="card"><h2>Machine-risk explorer</h2><form id="mf">
   <label>plant<select data-f="plant"><option value="">All</option>${PLANTS.map(p=>`<option ${p===f.plant?'selected':''}>${p}</option>`).join('')}</select></label>
   <label>finding severity<select data-f="severity"><option value="">Any</option>${['CRITICAL','HIGH','MEDIUM','LOW'].map(p=>`<option ${p===f.severity?'selected':''}>${p}</option>`).join('')}</select></label>
   <label>from<input type="date" data-f="date_from" value="${esc(f.date_from||'')}"></label><label>to<input type="date" data-f="date_to" value="${esc(f.date_to||'')}"></label>
   <label>sort by<select data-f="sort"><option value="">Risk index</option><option value="findings" ${f.sort==='findings'?'selected':''}>Findings in range</option></select></label><button>Apply</button><button type="button" class="sec" id="clr">Clear</button></form>
   <p class="mute">Risk index covers the whole analysed period (relative index, not a probability). Alarm and finding counts honour the filters.</p>
   ${tbl([['Rank',r=>r.rank],['Machine',r=>ml(r.machine_id)],['Name',r=>esc(r.machine_name)],['Plant',r=>esc(r.plant_id)],['Criticality',r=>esc(r.criticality)],['Risk index',r=>fmt(r.risk_score)],['Alarms in range',r=>fmt(r.alarms_in_range)],['Findings in range',r=>fmt(r.findings_in_range)]],d,'No machines match.')}</div>`;
}
function bindMachines(){
  $('#mf').onsubmit=e=>{e.preventDefault();state.mf={};document.querySelectorAll('#mf [data-f]').forEach(x=>{if(x.value)state.mf[x.dataset.f]=x.value});render()};
  $('#clr').onclick=()=>{state.mf={};render()};
}
async function machine(id){
  const d=await api('/api/machines/'+id), b=d.breakdown, maxp=Math.max(1,...b.components.map(c=>c.points)), maxd=Math.max(1,...d.alarms_by_day.map(x=>x.n));
  return `<p><a href="#machines">← Machines</a></p><div class="card"><h2>${esc(d.machine_id)} ${esc(d.machine_name)} <span class="mute">(${esc(d.machine_type)}, plant ${esc(d.plant_id)})</span></h2>
  <p>Risk index <b>${fmt(b.score)}</b>, rank <b>${d.rank}</b>. Fleet median ${b.fleet_median_score}, plant median ${b.plant_median_score}; higher than ${b.percentile_in_fleet}% of machines.</p>
  <table><thead><tr><th>Factor</th><th>Count</th><th>Weight</th><th>Points</th><th></th></tr></thead><tbody>${b.components.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.count}</td><td>${c.weight}</td><td>${c.points}</td><td><div class="bar" style="width:${Math.round(100*c.points/maxp)}px"></div></td></tr>`).join('')}</tbody></table>
  <p class="mute">${esc(b.interpretation)}</p></div>
  <div class="card"><h2>Findings (${d.findings.length})</h2>${tbl([['ID',r=>fl(r.finding_id)],['Severity',r=>sev(r.severity)],['Rule',r=>esc(r.rule_name)],['Title',r=>esc(r.title)]],d.findings,'No findings for this machine.')}</div>
  <div class="card"><h2>Alarms per day</h2>${d.alarms_by_day.map(x=>`<div class="row"><span class="mono" style="width:90px">${esc(x.day)}</span><div class="bar" style="width:${Math.round(300*x.n/maxd)}px"></div> ${x.n}</div>`).join('')}</div>
  <div class="card"><h2>Latest 100 alarm events</h2>${tbl([['Time',r=>ts(r.event_ts)],['ID',r=>`<span class="mono">${esc(r.alarm_event_id)}</span>`],['Alarm',r=>esc(r.alarm_code)],['Sev',r=>sev(r.severity)],['State',r=>esc(r.machine_state)],['Interlock',r=>esc(r.interlock_state)],['Class',r=>esc(r.classification)],['Ack delay (s)',r=>r.ack_delay_s==null?'none':fmt(r.ack_delay_s)]],d.recent_events)}</div>`;
}

/* ---------- Actions ---------- */
async function actions(){
  const d=await api('/api/actions');
  return `<div class="card"><h2>Workbench corrective actions</h2><p class="mute">Created from findings in this tool. Overdue is measured against the end of the analysed data (${esc(d.as_of)}).</p>
  ${tbl([['ID',r=>`<span class="mono">${esc(r.wb_action_id)}</span>`],['Finding',r=>fl(r.finding_id)],['Description',r=>esc(r.description)],['Owner',r=>esc(r.owner)],['Due',r=>esc(r.due_date||'—')],['State',r=>`<b>${esc(r.closure_state)}</b>${r.overdue?' <span class="badge bad">OVERDUE</span>':''}`],['Verification',r=>r.verifications.length?esc(r.verifications.map(v=>v.verified_by).join(', ')):'<span class="badge bad">none</span>']],d.workbench,'No workbench actions yet. Open a finding to create one.')}</div>
  <div class="card"><h2>Source-data actions closed without required verification (${d.source_unverified_closures.length})</h2><p class="mute">From the corrective-action records themselves (rule R-LC-01). Not treated as resolved.</p>
  ${tbl([['Action',r=>`<span class="mono">${esc(r.action_id)}</span>`],['Incident',r=>esc(r.incident_id)],['Machine',r=>ml(r.machine_id)],['Type',r=>esc(r.action_type)],['Assigned',r=>esc(r.assigned_to)],['Status',r=>esc(r.status)],['Verified by',r=>esc(r.verified_by||'MISSING')],['Closed',r=>ts(r.closed_ts)]],d.source_unverified_closures)}</div>`;
}

/* ---------- Quality / evaluation / rules ---------- */
async function quality(){
  const d=await api('/api/quality'), s=d.summary;
  return `<div class="card"><h2>Ingestion &amp; record validation</h2>${s?`<p>Source: <span class="mono">${esc(s.source_file)}</span> (mapping <b>${esc(s.source_name)}</b>, source timezone ${esc(s.source_timezone)}; all timestamps stored as UTC)</p>
   <div class="grid"><div class="card tile"><div class="n">${fmt(s.rows_read)}</div><div class="l">rows read</div></div><div class="card tile"><div class="n">${fmt(s.rows_valid)}</div><div class="l">valid</div></div><div class="card tile"><div class="n">${fmt(s.rows_rejected)}</div><div class="l">rejected (quarantined)</div></div></div>
   <p>Reject reasons: ${Object.keys(s.rejects_by_reason).length?Object.entries(s.rejects_by_reason).map(([k,v])=>`<b>${esc(k)}</b> ${v}`).join(' · '):'none'}</p>
   <p>Replayed duplicate events (identical content, new ID) are kept but flagged and excluded from analytics: <b>${fmt(d.duplicate_events_flagged)}</b>.</p>`:empty('No analysis run yet.')}
  ${tbl([['Source line',r=>r.source_line],['Event ID',r=>esc(r.alarm_event_id||'(missing)')],['Reasons',r=>`<b>${esc(r.reasons)}</b>`],['Detail',r=>esc(r.detail)],['Machine',r=>esc(r.machine_id||'')],['Raw event time',r=>esc(r.raw_event_ts||'')]],d.rejects,'No records were rejected.')}</div>`;
}
async function evaluation(){
  const d=await api('/api/evaluation'); if(!d.available) return `<div class="card"><h2>Evaluation</h2>${empty('No ground truth available for this data source (real data has none).')}</div>`;
  const e=d.evaluation, o=e.overall, p=x=>(100*x).toFixed(1)+'%';
  return `<div class="card"><h2>Detection evaluation vs. injected synthetic ground truth</h2><p class="mute">${esc(d.note)}</p>
  <p>Overall: injected <b>${o.injected}</b>, detected <b>${o.detected}</b>, TP <b>${o.true_positives}</b>, FP <b>${o.false_positives}</b>, FN <b>${o.false_negatives}</b> → precision <b>${p(o.precision)}</b>, recall <b>${p(o.recall)}</b>, F1 <b>${p(o.f1)}</b>. True negatives are not reported (the number of non-anomalous records is not a meaningful denominator here).</p>
  <p>Hard-negative controls (look-alike valid records): ${e.controls.total}, wrongly flagged: <b>${e.controls.wrongly_flagged}</b>.</p>
  ${tbl([['Category',r=>esc(r.anomaly_type)],['Injected',r=>r.injected],['Detected',r=>r.detected],['TP',r=>r.true_positives],['FP',r=>r.false_positives],['FN',r=>r.false_negatives],['Precision',r=>p(r.precision)],['Recall',r=>p(r.recall)],['F1',r=>p(r.f1)]],e.per_type)}
  <p class="mute">100% on clean injected anomalies is a property of the synthetic data, not a claim about field performance.</p></div>`;
}
async function rules(){
  const d=await api('/api/rules');
  return `<div class="card"><h2>Detection rules (thresholds live in src/fss/config.py)</h2>${tbl([['Rule',r=>`<b>${esc(r.rule_id)}</b>`],['Name',r=>esc(r.name)],['Logic',r=>esc(r.logic)],['Severity',r=>esc(r.severity)]],d)}</div>`;
}

/* ---------- Router ---------- */
let seq=0;
async function render(keep){
  const h=(location.hash||'#overview').slice(1), [page,arg]=h.split('/'); nav(page==='finding'?'findings':page==='machine'?'machines':page);
  const my=++seq; if(!keep) note('','');
  try{
    let html,bind;
    if(page==='overview'){html=await overview();bind=bindOverview}
    else if(page==='findings'){html=await findings();bind=bindFindings}
    else if(page==='finding'){html=await finding(arg);bind=bindFinding}
    else if(page==='machines'){html=await machines();bind=bindMachines}
    else if(page==='machine'){html=await machine(arg)}
    else if(page==='actions'){html=await actions()}
    else if(page==='quality'){html=await quality()}
    else if(page==='evaluation'){html=await evaluation()}
    else if(page==='rules'){html=await rules()}
    else html=empty('Page not found.');
    if(my!==seq) return; $('#view').innerHTML=html; if(bind) bind();
  }catch(e){ if(my===seq) $('#view').innerHTML=`<div class="err">Could not load this page: ${esc(e.message)}. Run <span class="mono">python run.py analyze</span> if no analysis exists yet.</div>`}
}
window.addEventListener('hashchange',()=>render());
api('/api/plants').then(p=>{PLANTS=p.map(x=>x.plant_id)}).catch(()=>{}).then(()=>render());
</script>
</body>
</html>
